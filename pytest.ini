[pytest]
pythonpath = .
testpaths = test
addopts = -v -ra
markers =
    smoke: pruebas rápidas y críticas para verificar que la app arranca y el flujo básico funciona (sanity check)
    functional: pruebas funcionales del módulo Your Feed que validan comportamientos y reglas de negocio
    integration: pruebas que validan la interacción entre módulos/servicios (p. ej., UI + backend + storage)